# Unsigned EdgeHTML Xbox package. Signing stays off GitHub: this job never
# sees a .pfx and never references a signing secret. GITHUB_TOKEN is used only
# to attach the unsigned .msix to the release for the tag.
name: Xbox EdgeHTML release

on:
  push:
    tags:
      # Four-part tags such as v1.0.9.0. The job rejects anything that is not
      # exactly four numeric parts (Appx versions are Major.Minor.Build.Revision).
      - 'v*.*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Four-part package version without the v prefix, e.g. 1.0.9.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: xbox-edgehtml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: xbox/package-lock.json

      - name: Resolve package version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VER="$INPUT_VERSION"
          else
            VER="${REF_NAME#v}"
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be four numeric parts like 1.0.9.0 (tag v1.0.9.0). Got: ${VER}" >&2
            exit 1
          fi
          IFS=. read -r a b c d <<< "$VER"
          for n in "$a" "$b" "$c" "$d"; do
            if (( n > 65535 )); then
              echo "Appx version part $n is above 65535" >&2
              exit 1
            fi
          done
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Package version $VER"

      - name: Install makemsix build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang python3 python3-venv pkg-config libicu-dev zlib1g-dev

      - name: Record the ICU soname
        id: icu
        run: echo "lib=$(basename "$(echo /usr/lib/*/libicuuc.so.* | awk '{print $1}')")" >> "$GITHUB_OUTPUT"

      - name: Cache makemsix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: xbox/.tools/makemsix
          key: makemsix-25a65f5c1690930813bcc10cdf1d59fa865f2bb1-${{ runner.os }}-${{ steps.icu.outputs.lib }}-v1

      - name: Build the unsigned EdgeHTML package
        working-directory: xbox
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          npm ci
          ./pack-legacy.sh "$VER"

      - name: Upload package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SKYCHARGE_EdgeHTML_x64_${{ steps.ver.outputs.version }}_unsigned
          if-no-files-found: error
          path: |
            xbox/dist/SKYCHARGE_EdgeHTML_x64_${{ steps.ver.outputs.version }}_unsigned.msix
            xbox/dist/SKYCHARGE_EdgeHTML_x64_${{ steps.ver.outputs.version }}_unsigned.msix.sha256

      - name: Attach the unsigned package to the GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VER}"
          MSIX="xbox/dist/SKYCHARGE_EdgeHTML_x64_${VER}_unsigned.msix"
          SUM="xbox/dist/SKYCHARGE_EdgeHTML_x64_${VER}_unsigned.msix.sha256"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "SKYCHARGE ${VER}" \
              --notes "Unsigned EdgeHTML Xbox package for ${VER}. A separate machine signs SKYCHARGE_EdgeHTML_x64_${VER}_unsigned.msix and uploads SKYCHARGE_EdgeHTML_x64_${VER}.msix to this release. This workflow does not sign."
          fi
          gh release upload "$TAG" "$MSIX" "$SUM" --clobber
