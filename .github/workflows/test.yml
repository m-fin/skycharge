name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # headless Chrome (preinstalled on ubuntu-latest at /usr/bin/google-chrome) with SwiftShader WebGL.
      - run: npm test
      - name: Xbox packaging tests
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 -m unittest xbox/test_sync_game_src.py xbox/test_stage_music.py
